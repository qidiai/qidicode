name: android-apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        shell: bash
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/qidicode-remote-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidicode-remote-apk
          path: android/qidicode-remote-debug.apk
