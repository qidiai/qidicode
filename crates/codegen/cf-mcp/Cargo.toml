[package]
license = "Apache-2.0"
name = "cf-mcp"
version = "0.1.0"
edition.workspace = true
description = "MCP integration crate. Quarantines rmcp + reqwest 0.13 (rmcp 2.1 requires reqwest >= 0.13.2 while the rest of the workspace uses reqwest 0.12) and owns the MCP credential store and OAuth flow orchestrator."
authors = ["xAI"]

[dependencies]
cf-computer-hub-sdk = { workspace = true }
rmcp = { version = "2.1", features = [
    "auth",
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
# reqwest 0.13 feature set for MCP transports. Notably:
# - `blocking` is for build-script style use (not actually used here today, but
#   kept for future MCP transports that may need it).
# - `query`/`form` opt-in features stay off; rmcp transports don't use them.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "stream",
] }

# Deps for credentials.rs + oauth.rs.
async-trait = { workspace = true }
axum = { workspace = true }
oauth2 = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
webbrowser = { workspace = true }
cf-config= { workspace = true }

# For mcp_http_client.rs (rmcp trait signatures). Must match rmcp 2.1's own
# versions or the trait types won't unify.
http = { workspace = true }
sse-stream = "0.2"

# Deps for servers.rs.
agent-client-protocol = { workspace = true }
cf-file-utils = { path = "../cf-file-utils" }
futures = { workspace = true }
regex = { workspace = true }
# Local JSON Schema validation of MCP tool arguments (draft-07, as emitted by
# schemars). default-features = false: no HTTP/file $ref retrieval - keeps
# reqwest 0.12 out of this quarantine crate and prevents untrusted server
# schemas from triggering network/filesystem reads during validation.
jsonschema = { version = "0.30.0", default-features = false }
which = { workspace = true }
# Atomic descriptor writes (NamedTempFile + persist) in materialize_descriptors.
tempfile = { workspace = true }
cf-tools= { workspace = true }
cf-workspace-types = { workspace = true }
cf-telemetry= { path = "../cf-telemetry" }
cf-version= { workspace = true }
cf-tool-protocol = { workspace = true }
cf-tool-runtime = { workspace = true }
cf-tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# B6: Windows ACL tightening on the MCP credential temp file (parity with
# Unix mode 0600). Only the Authorization + Threading features needed by
# `set_windows_owner_only_acl` in credentials.rs.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Used in servers.rs test `test_same_raw_name_different_servers_no_local_registry_collision`
# to verify MCP tools register into a `LocalRegistry` without collision.
# `test-util` enables `tokio::time::pause` / `advance`, required by
# the deterministic timing tests in `liveness.rs`.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true