[package]
license = "Apache-2.0"
name = "cf-shell"
version = "0.1.220-alpha.4"
edition.workspace = true

[features]
default = []
unstable = []
default-bazel = [
    ]

[dependencies]
cf-tracing-macros = { workspace = true }
prod-mc-cli-chat-proxy-types = { workspace = true }
cf-announcements= { path = "../cf-announcements" }
cf-plugin-marketplace = { path = "../cf-plugin-marketplace" }
cf-subagent-resolution = { path = "../cf-subagent-resolution" }
cf-system-power = { path = "../cf-system-power" }
cf-telemetry= { path = "../cf-telemetry" }
cf-auth= { workspace = true }
zeroize = "1"
cf-secrets= { path = "../cf-secrets" }
cf-shared= { path = "../cf-shared" }
cf-interjection-core = { workspace = true }
cf-computer-hub-sdk = { workspace = true }
cf-version= { workspace = true }
cf-paths= { path = "../cf-paths" }
cf-codebase-graph = { path = "../cf-codebase-graph" }
dunce = { workspace = true }
tonic-prost = { workspace = true, optional = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
cf-prompt-queue = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
kanal = "0.1"
regex = { workspace = true }
# rmcp 2.1 + reqwest 0.13 are quarantined inside `cf-mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `xai_grok_mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of cf-mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
cf-mcp= { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
# Bumped from 0.32 to resolve CVE-2025-29087, CVE-2025-3277, CVE-2025-6965.
# sqlite-vec is C ABI, not Rust-version dependent — any rusqlite with `bundled` works.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
similar = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
dirs = "6"
tokio-stream = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
obfstr = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
cf-acp-lib = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
webbrowser = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
gcloud-storage = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = "0.15"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
base64 = { workspace = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2 = { workspace = true }
rand = { workspace = true }
shlex = { workspace = true }
strum = { workspace = true }
cf-fast-worktree = { path = "../cf-fast-worktree", features = ["metadata"] }

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
cf-shell-base = { workspace = true }
cf-shell-session-support = { workspace = true }
cf-fsnotify= { path = "../cf-fsnotify" }
cf-hunk-tracker = { path = "../cf-hunk-tracker" }
cf-agent-lifecycle = { workspace = true }
cf-sandbox= { path = "../cf-sandbox", default-features = false }
cf-chat-state = { path = "../cf-chat-state" }
cf-compaction= { path = "../../common/cf-compaction" }
cf-sampler= { path = "../cf-sampler" }
cf-sqlite-journal = { workspace = true }
cf-token-estimation = { workspace = true }
cf-sampling-types = { path = "../cf-sampling-types" }
cf-tools= { workspace = true }
cf-tty-utils = { workspace = true }
cf-workspace= { workspace = true }
cf-agent= { path = "../cf-agent" }
cf-config= { workspace = true }
# cf-config-types merged into cf-config; use xai_grok_config instead
cf-memory= { workspace = true }
cf-hooks= { path = "../cf-hooks" }
cf-hooks-plugins-types = { path = "../cf-hooks-plugins-types" }
cf-file-utils = { path = "../cf-file-utils" }
cf-http= { workspace = true }
cf-models= { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
process-wrap = { version = "9.0.0", features = ["tokio1", "job-object", "creation-flags"] }
portable-pty = "0.9"
parking_lot.workspace = true
dashmap.workspace = true

# Used by acp_session.rs and mcp_servers.rs for the unified
# xai_tool_runtime::Tool dispatch model and the computer-hub MCP adapter.
cf-tool-runtime = { workspace = true }
cf-tool-protocol = { workspace = true }
cf-tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
filetime = { workspace = true }
tempfile = { workspace = true }
cf-memory= { workspace = true, features = ["test-helpers"] }
cf-workspace= { workspace = true, features = ["test-helpers"] }
# Cross-crate test helpers: `cfg(test)` does not propagate across crate
# boundaries, so upstream test-only surfaces (`WorkspaceOps::for_test`,
# `MemoryStorage::with_paths`, `EnvVarGuard`, CpuProfileManager seams) are
# gated behind each crate's `test-helpers` feature, enabled here.
cf-test-support = { workspace = true }
cf-test-utils = { workspace = true }
# Feature-unification applies the signing seam to the lib when building tests, so
# integration tests can inject a throwaway trusted key; production builds exclude
# dev-deps and compile the seam out.
cf-config= { workspace = true, features = ["test-helpers"] }
# Ed25519 signing for the managed-config signature tests.
ring = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
rsa = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
cf-shell-base = { workspace = true, features = ["test-helpers"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[lints]
workspace = true
[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }
[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"