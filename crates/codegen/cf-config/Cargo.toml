[package]
license = "Apache-2.0"
name = "cf-config"
version = "0.1.0"
edition.workspace = true
description = "Shared config loading for Grok — grok_home, effective config (requirements > user > managed), TOML merge"

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
strum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
dunce = { workspace = true }
# Shared signed deployment-config envelope contract with the cli-chat-proxy signer.
ring = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = "3.1"
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
which = { workspace = true }
cf-tty-utils = { workspace = true }
cf-version= { workspace = true }
prod-mc-cli-chat-proxy-types = { workspace = true }

# core-foundation: read macOS MDM managed preferences (`ai.x.grok`) for the
# admin-deployed requirements layer.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Exposes the signed-policy test seam (`set_embedded_keys`) to sibling crates'
# test builds under cargo, where a dependency is never compiled with `cfg(test)`.
# Never enabled by production builds.
test-helpers = []

[lints]
workspace = true