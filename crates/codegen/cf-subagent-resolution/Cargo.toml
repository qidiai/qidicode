[package]
license = "Apache-2.0"
name = "cf-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Subagent configuration resolution: merges persona, role, and spawn-time overrides into a resolved spec"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
cf-sampling-types = { path = "../cf-sampling-types" }
cf-tools= { workspace = true }
cf-tool-types.workspace = true
