[patch.crates-io]
# No patches needed - all aliases handled via workspace.dependencies


[profile.release]
incremental = true
panic = "abort"

[profile.release-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = false
debug = 1
split-debuginfo = "off"

[profile.x-prod]
inherits = "release"

[profile.release-dist-jemalloc]
inherits = "release"

[profile.dev]
opt-level = 0

[profile.bench]
inherits = "release"

[workspace.lints.rust]
# `unsafe_code` intentionally unset: 159 files use `unsafe` (FFI, edition-2024 env
# APIs), so a workspace-wide warn fails the `-D warnings` gate on pre-existing code.
# Gate net-new unsafe via PR review / CI diff check, not a blanket workspace lint.
unused_must_use = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
needless_lifetimes = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
useless_format = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
